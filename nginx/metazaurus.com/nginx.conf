# Redirect www to non-www (301 permanent)
if ($host = www.metazaurus.com) {
    return 301 https://metazaurus.com$request_uri;
}

# Bot detection for SEO
set $is_bot "";
if ($http_user_agent ~* "(facebookexternalhit|Twitterbot|Discordbot|Slackbot|LinkedInBot|WhatsApp|TelegramBot|Applebot|Google.*snippet|Googlebot|bingbot|SkypeUriPreview|redditbot|Meta-ExternalAgent)") {
    set $is_bot "1";
}

# Category and slug pages: bot → PHP SEO handler, non-bot → SPA
# Negative lookahead excludes .php to avoid rewrite loops
location ~ ^/(characters|locations|world|codex|book|fanfic|magazine|manga|cards)(/(?!.*\.php)[^/?#]*)?/?$ {
    if ($is_bot = "1") {
        rewrite ^ /index.php last;
    }
    try_files $uri /index.html;
}

# SPA catch-all
location / {
    try_files $uri /index.html;
}
